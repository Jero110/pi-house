name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Paste errors as text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pih --version`
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [cmux, tmux]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: macOS, Linux or WSL2, and your Node version (`node --version`)
    validations:
      required: true
